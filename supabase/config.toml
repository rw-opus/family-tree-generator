
[auth]
enabled = true
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.rate_limit]
email_sent = 2
sms_sent = 10
anonymous_users = 10
token_refresh = 100
sign_in_sign_ups = 10
token_verifications = 10
web3 = 10

[functions.create-tree-checkout]
enabled = true
verify_jwt = true
import_map = "./functions/create-tree-checkout/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-tree-checkout/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-tree-checkout/*.html" ]

[functions.stripe-tree-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-tree-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/stripe-tree-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/stripe-tree-webhook/*.html" ]
