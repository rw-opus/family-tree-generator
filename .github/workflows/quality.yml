name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes the run in flight. main is never cancelled, so its
# result stays a truthful record of what was merged.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

      # The build runs before the tests: tests/unit/server.test.js makes real
      # requests against dist/, including the precompressed variants, and would
      # otherwise skip the whole delivery layer.
      - run: npm run build
      - run: npm test

      # A3 — the built bundle is what reaches a browser, so it is scanned too.
      - run: npm run scan:secrets

      - run: npm audit --omit=dev --audit-level=high
