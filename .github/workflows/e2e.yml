name: End-to-end

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci

      # Chromium runs the complete suite. WebKit runs a bounded iPhone/iPad
      # workflow subset because those browsers share Apple's engine.
      - run: npx playwright install --with-deps chromium webkit

      # The delivery project runs against this build through server.mjs, so the
      # precompressed assets and build-info must exist before the suite starts.
      - run: npm run build

      - run: npx playwright test

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
