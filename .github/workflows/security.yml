name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    # Branch protection requires this job. Keep the synthetic restore drill in
    # the same context so backup evidence cannot be bypassed by merging a PR
    # whose tenant-isolation checks alone passed.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.114.0

      # Applies supabase/migrations from scratch, so the policies under test are
      # exactly the ones a fresh production project would receive.
      - name: Start a local Supabase stack
        run: supabase start

      # Read explicitly rather than by blanket-prefixing, so a rename in the CLI
      # surfaces as an empty value here instead of as a confusing test failure.
      - name: Export the stack's credentials
        run: |
          status="$(supabase status -o json)"
          anon="$(echo "$status" | jq -r '.ANON_KEY // empty')"
          service="$(echo "$status" | jq -r '.SERVICE_ROLE_KEY // empty')"
          jwt_secret="$(echo "$status" | jq -r '.JWT_SECRET // empty')"
          api="$(echo "$status" | jq -r '.API_URL // empty')"
          db_url="$(echo "$status" | jq -r '.DB_URL // empty')"
          for credential in "$anon" "$service" "$jwt_secret" "$db_url"; do
            if [ -n "$credential" ]; then
              echo "::add-mask::$credential"
            fi
          done
          missing=()
          [ -z "$anon" ] && missing+=("ANON_KEY")
          [ -z "$service" ] && missing+=("SERVICE_ROLE_KEY")
          [ -z "$jwt_secret" ] && missing+=("JWT_SECRET")
          [ -z "$api" ] && missing+=("API_URL")
          [ -z "$db_url" ] && missing+=("DB_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Could not read required local stack fields: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          {
            echo "SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "SUPABASE_JWT_SECRET=$jwt_secret"
            echo "SUPABASE_URL=$api"
            echo "SUPABASE_DB_URL=$db_url"
            echo "FTG_RLS_DB_FIXTURE_CONFIRMATION=ALLOW_ONLY_DISPOSABLE_LOCAL_RLS_FIXTURES"
          } >> "$GITHUB_ENV"

      - name: Prove cross-account isolation
        run: npm run test:rls

      - name: Prove database security invariants
        run: supabase test db

      - name: Show the database logs on failure
        if: failure()
        run: supabase logs db || true

      - name: Stop the tenant-isolation stack
        if: always()
        run: supabase stop --no-backup || true

      - name: Confirm local restore prerequisites
        run: |
          psql --version
          jq --version
          tar --version

      - name: Prove a synthetic encrypted backup can be restored
        # G4-G9 evidence for the backup mechanics only. This creates two
        # disposable local stacks and fictional users; it has no environment,
        # provider credential, production URL or scheduled trigger.
        env:
          FTG_SYNTHETIC_RESTORE_CONFIRMATION: DESTROY_ONLY_A_DISPOSABLE_LOCAL_SYNTHETIC_TARGET
        run: bash scripts/backup/run-synthetic-restore-drill.sh
