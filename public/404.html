<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Family Tree Generator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #16382d;
        background: #f5f7f6;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        padding: 2rem;
        text-align: center;
        background: #fff;
        border: 1px solid #d9e2de;
        border-radius: 1rem;
        box-shadow: 0 1rem 2.5rem rgb(0 50 35 / 10%);
      }
      h1 {
        margin-top: 0;
        font-family: Georgia, serif;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        color: #fff;
        background: #004225;
        border-radius: 0.6rem;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>The address may be incorrect or the page may have moved.</p>

</html>
